  # handle samoa/papua/hihifo via the existing branch but only for paths
  # prefixed with cdb-library/buildings/samoa/ -- the houses/ subtree was
  # being missed.  Promote these explicitly here.

  # Pacific cluster -- small island vernacular: thatched hip / pyramid roofs,
