# Track A library region assignments (visual triage).
#
# Each entry maps a `family_prefix` (a path prefix in the library's
# library.txt EXPORT virtual paths) to one or more regions.  Regions follow
# the same vocabulary as _O4SFR_PATH_REGION_TOKENS in
# src/O4_SFR_Building_Overlay.py:
#   europe | scandinavia | mediterranean
#   north_america | south_america
#   asia | se_asia | africa | australia_oceania
#   generic
#
# Rule: lock to a region only when the visual is strongly that region.
# "generic" makes the asset usable in every tile but lower priority than a
# region-locked asset for the same BLD_CLASS bucket.

version: 1
decisions:
  # ---- OpenSceneryX -------------------------------------------------------
  - lib_id: opensceneryx
    family_prefix: opensceneryx/objects/buildings/residential/houses/wooden/
    regions: [europe]
    confidence: high
    notes: "Haussmannian-style multi-storey facade: cream stone walls, shutters, dark mansard roofs"
  - lib_id: opensceneryx
    family_prefix: opensceneryx/objects/buildings/residential/houses/brick/
    regions: [generic]
    confidence: low
    notes: "Brick texture; render lacks shape detail to lock a region"
